<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نبض آرامش</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#17364b,#398b83);font-family:Vazirmatn,Tahoma,sans-serif;color:#20334a;padding:18px}
main{max-width:760px;margin:25px auto;background:#fffaf0;border-radius:25px;padding:22px;box-shadow:0 15px 45px #10283b77}
h1{text-align:center;color:#147f7a;font-size:30px}
.subtitle{text-align:center;color:#60718b}
.person{display:flex;align-items:center;gap:12px;margin:20px 0 8px}
.avatar{font-size:35px;background:#e3f2ef;border-radius:15px;padding:8px}
.name{font-size:18px;font-weight:800;color:#168e88}
.message{font-size:19px;line-height:2.1;background:#edf6f8;border-radius:18px;padding:17px;margin:0 0 22px}
.doctor .message{background:#fff1d8}
button{font:800 17px Vazirmatn,Tahoma;border:0;border-radius:14px;padding:13px 22px;background:#159b91;color:white;cursor:pointer}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#progress{text-align:center;color:#718095;margin-top:15px}
footer{text-align:center;margin-top:25px;color:#718095;font-size:13px}
</style>
</head>
<body>
<main>
<h1>🌿 نبض آرامش</h1>
<p class="subtitle">گفت‌وگوی استاد دارستانی با دانش‌آموز درباره راه‌های کنترل خشم</p>
<section id="conversation"></section>
<div class="controls">
<button id="next">ادامه گفت‌وگو ←</button>
<button id="restart" style="background:#64748b">شروع دوباره</button>
</div>
<div id="progress"></div>
<footer>ساخته شده توسط محمد صدرا اسدی<br>مدرسه امام جواد (ع)</footer>
</main>
<script>
const dialogue=[
['student','دانش‌آموز علی','🧑🏻‍🎓','استاد، امروز در کلاس وقتی یکی از هم‌کلاسی‌هایم حرفم را قطع کرد، خیلی عصبانی شدم. احساس کردم اصلاً به من احترام نگذاشته است. تمام مدت به آن اتفاق فکر می‌کردم و نمی‌دانستم چطور باید واکنش نشان بدهم. چطور می‌توانم جلوی این را بگیرم که عصبانیت، تصمیم‌هایم را کنترل کند؟'],
['doctor','استاد دارستانی','👨🏻‍⚕️','اول از همه باید بدانی که خشم، مثل بقیه احساسات انسان، به‌خودی‌خود بد یا عجیب نیست. خشم گاهی به ما خبر می‌دهد که چیزی برایمان مهم بوده، احساس بی‌عدالتی کرده‌ایم یا یکی از مرزهایمان رعایت نشده است. مسئله اصلی این نیست که هرگز عصبانی نشویم؛ مسئله این است که هنگام عصبانیت، رفتاری انتخاب کنیم که به خودمان و دیگران آسیب نزند.'],
['student','دانش‌آموز علی','🧑🏻‍🎓','اما استاد، وقتی عصبانی می‌شوم، انگار همه چیز خیلی سریع اتفاق می‌افتد. بعداً ممکن است بفهمم می‌توانستم بهتر جواب بدهم، ولی همان لحظه فقط می‌خواهم فوری جواب بدهم. آیا راهی هست که در همان لحظه کمی فرصت پیدا کنم؟'],
['doctor','استاد دارستانی','👨🏻‍⚕️','بله. یکی از بهترین تمرین‌ها «مکث کوتاه» است. وقتی متوجه شدی بدنت منقبض شده یا صدایت دارد بلندتر می‌شود، لازم نیست همان لحظه پاسخ بدهی. اگر شرایط اجازه می‌دهد چند قدم از بحث فاصله بگیر، شانه‌هایت را رها کن و چند نفس آرام و معمولی بکش. بازدم را کمی طولانی‌تر کن. همین فاصله کوتاه کمک می‌کند از واکنش عجولانه به انتخاب آگاهانه نزدیک شوی.'],
['student','دانش‌آموز علی','🧑🏻‍🎓','گاهی حتی نمی‌دانم دقیقاً چرا ناراحتم. فقط می‌دانم عصبانی‌ام. مثلاً شاید از حرف دوستم ناراحت شده باشم، ولی دلیلش را درست متوجه نمی‌شوم. در این شرایط چه کار کنم؟'],
['doctor','استاد دارستانی','👨🏻‍⚕️','احساست را با چند کلمه نام‌گذاری کن. از خودت بپرس: «الان دقیقاً چه احساسی دارم؟» شاید زیر خشم، ناراحتی، خجالت، نگرانی یا احساس نادیده گرفته شدن وجود داشته باشد. بعد از خودت بپرس: «چه چیزی باعث شد این احساس به وجود بیاید؟» لازم نیست فوراً جواب کامل پیدا کنی. همین که احساس و علت احتمالی‌اش را تشخیص بدهی، یک قدم مهم برداشته‌ای.'],
['student','دانش‌آموز علی','🧑🏻‍🎓','اگر طرف مقابل واقعاً حرف بدی زده باشد چه؟ آیا آرام ماندن یعنی باید سکوت کنم و اجازه بدهم هر طور خواست با من رفتار کند؟'],
['doctor','استاد دارستانی','👨🏻‍⚕️','نه، آرام بودن به معنی پذیرفتن رفتار نادرست نیست. می‌توانی قاطع و محترمانه از خودت دفاع کنی. به‌جای توهین یا سرزنش، درباره رفتار مشخص و احساست حرف بزن. مثلاً بگو: «وقتی وسط حرفم می‌پری، احساس می‌کنم شنیده نمی‌شوم. لطفاً اجازه بده حرفم را تمام کنم.» این روش هم مرز تو را روشن می‌کند و هم احتمال تبدیل اختلاف به دعوا را کمتر می‌کند.'],
['student','دانش‌آموز علی','🧑🏻‍🎓','پس بهتر است به‌جای اینکه بگویم «تو همیشه بی‌احترامی می‌کنی»، درباره همان اتفاق و احساسم صحبت کنم. اگر هنوز خیلی عصبانی بودم، می‌توانم بگویم بعداً درباره‌اش حرف می‌زنیم؟'],
['doctor','استاد دارستانی','👨🏻‍⚕️','دقیقاً. می‌توانی بگویی: «الان ناراحتم و نمی‌خواهم با عصبانیت حرف بزنم. کمی زمان می‌خواهم تا آرام‌تر شوم، بعد صحبت می‌کنیم.» البته بهتر است واقعاً در زمان مناسبی به گفت‌وگو برگردی. فاصله گرفتن برای آرام شدن است، نه برای تنبیه کردن یا نادیده گرفتن طرف مقابل.'],
['student','دانش‌آموز علی','🧑🏻‍🎓','برای اینکه کمتر زود عصبانی شوم، فقط باید همان لحظه تمرین کنم یا کارهای دیگری هم هست که در طول روز کمک کند؟'],
['doctor','استاد دارستانی','👨🏻‍⚕️','عادت‌های روزانه هم مهم‌اند. خواب کافی، فعالیت بدنی متعادل، استراحت بین کارها و صحبت کردن با یک فرد قابل اعتماد می‌توانند تحمل فشار را بهتر کنند. اتفاقات ناراحت‌کننده را هم می‌توانی در دفترچه‌ای بنویسی: چه اتفاقی افتاد، چه احساسی داشتی و دفعه بعد چه واکنش بهتری می‌توانی امتحان کنی. اگر خشم خیلی شدید یا تکرارشونده است و در زندگی روزمره‌ات مشکل ایجاد می‌کند، کمک گرفتن از مشاور مدرسه یا یک بزرگسال مورد اعتماد کار عاقلانه‌ای است.'],
['student','دانش‌آموز علی','🧑🏻‍🎓','فکر می‌کنم حالا یک برنامه دارم: اول مکث می‌کنم، چند نفس آرام می‌کشم، احساسم را نام می‌گذارم و بعد محترمانه می‌گویم چه چیزی ناراحتم کرده است. اگر نتوانستم آرام شوم، از یک فرد قابل اعتماد کمک می‌گیرم.'],
['doctor','استاد دارستانی','👨🏻‍⚕️','آفرین علی. یادت باشد مدیریت خشم یک مهارت است و مثل هر مهارت دیگری با تمرین بهتر می‌شود. قرار نیست همیشه بی‌نقص عمل کنی. اگر یک بار واکنش مناسبی نداشتی، می‌توانی مسئولیت رفتارت را بپذیری، عذرخواهی کنی و برای دفعه بعد راه بهتری انتخاب کنی. قدرت واقعی، نادیده گرفتن احساسات نیست؛ شناختن آن‌ها و انتخاب رفتار سنجیده است.']
];
let index=0;
const section=document.getElementById('conversation');
function render(){
 if(index>=dialogue.length){
 section.innerHTML='<h2 style="text-align:center;color:#159b91">🌱 گفت‌وگو به پایان رسید</h2><p class="message">یادت باشد: احساس خشم طبیعی است؛ مهم این است که با آن چه رفتاری انتخاب می‌کنیم. مکث، نفس آرام، نام‌گذاری احساس و گفت‌وگوی محترمانه می‌توانند کمک‌کننده باشند.</p>';
 document.getElementById('next').textContent='پایان';
 }else{
 const [type,name,face,text]=dialogue[index];
 section.innerHTML='<div class="person"><div class="avatar">'+face+'</div><div class="name">'+name+'</div></div><p class="message '+type+'">'+text+'</p>';
 document.getElementById('next').textContent=index===dialogue.length-1?'دیدن نتیجه ✓':'ادامه گفت‌وگو ←';
 }
 document.getElementById('progress').textContent='پیام '+Math.min(index+1,dialogue.length)+' از '+dialogue.length;
}
document.getElementById('next').onclick=()=>{if(index<dialogue.length)index++;render()};
document.getElementById('restart').onclick=()=>{index=0;render()};
render();
</script>
</body>
  </html>
